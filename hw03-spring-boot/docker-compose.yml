services:
  moodle-db:
    image: postgres:16-alpine
    container_name: attestation-moodle-db
    environment:
      POSTGRES_DB: moodle
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: moodle
    ports:
      - "5432:5432"
    volumes:
      - moodle-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodle -d moodle"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  moodle-pgdata:
